[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "resqmonitor"
version = "0.2.0"
description = "Local classification outcome, confidence, cost and baseline measurements"
readme = "README.md"
license = "LicenseRef-Noncommercial-Local-Use-1.0.0"
license-files = ["LICENSE.md"]
requires-python = ">=3.11"
authors = [{name = "dr-opoku"}]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]

[project.scripts]
resqmonitor = "resqmonitor.__main__:main"

[project.urls]
Repository = "https://github.com/dr-opoku/resqmonitor"

[tool.setuptools.packages.find]
include = ["resqmonitor*"]

[tool.setuptools.package-data]
resqmonitor = ["fixtures/*.csv", "fixtures/*.json"]
