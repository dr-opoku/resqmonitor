name: Offline checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/reproduce_examples.py --check
      - run: python -m pip install .
      - name: Installed command and packaged fixture smoke check
        working-directory: ${{ runner.temp }}
        run: resqmonitor demo --format json
  optional-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install '.[mcp]'
      - run: python -m unittest discover -s tests -p test_mcp.py -v
